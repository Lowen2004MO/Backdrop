AWSTemplateFormatVersion: '2010-09-09'
Description: Account-level bootstrap resources for People Pulse Terraform deployments.

Parameters:
  ProjectName:
    Type: String
    Default: people-pulse
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Lowercase project name used in the state bucket and budget names.
  BudgetEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Email address that receives AWS Budget alerts.
  MonthlyBudgetAmount:
    Type: Number
    Default: 25
    MinValue: 1
    Description: Monthly account budget in USD.

Resources:
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AWS::AccountId}-${AWS::Region}-${ProjectName}-tfstate'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: RetainRecentStateHistory
            Status: Enabled
            Prefix: ''
            NoncurrentVersionExpiration:
              NoncurrentDays: 365
              NewerNoncurrentVersions: 25
      Tags:
        - Key: Application
          Value: !Ref ProjectName
        - Key: Purpose
          Value: terraform-state
        - Key: ManagedBy
          Value: cloudformation

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub '${TerraformStateBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  AccountMonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${ProjectName}-monthly-account-budget'
        BudgetLimit:
          Amount: !Ref MonthlyBudgetAmount
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetEmail
              SubscriptionType: EMAIL

Outputs:
  TerraformStateBucketName:
    Description: Pass this value to terraform init as the S3 backend bucket.
    Value: !Ref TerraformStateBucket
  TerraformStateBucketArn:
    Value: !GetAtt TerraformStateBucket.Arn
  BudgetName:
    Value: !Sub '${ProjectName}-monthly-account-budget'
