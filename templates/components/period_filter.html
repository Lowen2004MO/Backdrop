<fieldset class='period-selector'><legend>Survey periods</legend><div class='period-toolbar'><div class='period-shortcuts' aria-label='Common period selections'><label><input type='checkbox' id='most-recent-period' name='most_recent' value='1' {% if most_recent_checked %}checked{% endif %}> Most recent only</label><label><input type='checkbox' id='all-survey-periods' name='all_periods' value='1' {% if all_periods_checked %}checked{% endif %}> All periods</label></div><details class='period-dropdown'><summary>Select survey periods <span>{{ selected|length }} selected</span></summary><div class='period-dropdown-panel'><p class='field-hint'>Tick any combination, then use the page's apply button.</p><div class='checkbox-grid' role='group' aria-label='Available survey periods'>{% for survey in all_surveys %}<label><input type='checkbox' name='period' value='{{ survey.slug }}' {% if survey.slug in selected %}checked{% endif %}> <span>{{ survey.label }}</span></label>{% endfor %}</div><button class='button primary' type='button' data-close-dropdown>OK</button></div></details></div></fieldset>
